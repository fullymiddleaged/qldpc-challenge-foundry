[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qldpc-lab"
version = "0.1.0"
description = "Search, lay out, certify and submit quantum LDPC codes (bivariate bicycle family first)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
sim = ["stim>=1.13", "ldpc>=2.0"]
dev = ["pytest>=7", "networkx>=3"]

[tool.setuptools]
packages = ["qec_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]
